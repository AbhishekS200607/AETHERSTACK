<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex, nofollow"/>
  <title>Join the Team | Aetherstack</title>
  <link rel="icon" href="/Logo%20maker%20project.png" type="image/png"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800;900&family=Manrope:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#ff6035",
            "primary-container": "#ff6035",
            "on-primary": "#ffffff",
            "on-primary-fixed": "#ffffff",
            "tertiary": "#7b61ff",
            "background": "#f7f7f8",
            "surface": "#ffffff",
            "on-background": "#111111",
            "on-surface": "#111111",
            "on-surface-variant": "#666666",
            "outline": "#c4c4c8",
            "outline-variant": "#dcdce0",
          },
          fontFamily: { "headline": ["Space Grotesk"], "body": ["Manrope"] },
          borderRadius: { "2xl": "1rem", "3xl": "1.5rem" }
        }
      }
    }
  </script>
  <style>
    * { box-sizing: border-box; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    .glass-nav { background: rgba(255,255,255,0.82); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid rgba(0,0,0,0.06); box-shadow: 0 2px 32px rgba(0,0,0,0.07); }
    .gradient-primary { background: linear-gradient(135deg, #ff6035 0%, #ff8c42 100%); position: relative; overflow: hidden; }
    .gradient-primary::after { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, #ff8c42 0%, #ff6035 100%); opacity: 0; transition: opacity 0.4s; }
    .gradient-primary:hover::after { opacity: 1; }
    .gradient-primary > * { position: relative; z-index: 1; }
    
    .hero-noise::before {
      content: ''; position: absolute; inset: 0;
      background-image: linear-gradient(rgba(0,0,0,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,0.03) 1px, transparent 1px);
      background-size: 80px 80px; pointer-events: none; z-index: 1;
    }

    .float-field { position: relative; margin-bottom: 1.5rem; }
    .float-field input {
      width: 100%; background: transparent; border: none; border-bottom: 2px solid #c4c4c8;
      padding: 20px 0 6px 0; font-family: 'Manrope', sans-serif; font-size: 1rem; color: #111111;
      outline: none !important; border-radius: 0; transition: border-color 0.3s;
    }
    .float-field input:focus { border-color: #ff6035; }
    .float-field label {
      position: absolute; left: 0; top: 20px; color: #666666; font-size: 1rem; pointer-events: none;
      transition: all 0.3s cubic-bezier(0.22,1,0.36,1); font-weight: 500;
    }
    .float-field input:focus ~ label,
    .float-field input:not(:placeholder-shown) ~ label { top: 0; font-size: 0.75rem; color: #ff6035; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }

    .eye-btn { position: absolute; right: 0; top: 20px; color: #666666; cursor: pointer; padding: 4px; transition: color 0.2s; }
    .eye-btn:hover { color: #ff6035; }

    .step { transition: opacity 0.4s, transform 0.4s; }
    .step.hidden-step { opacity: 0; transform: translateY(16px); pointer-events: none; height: 0; overflow: hidden; }

    .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); padding: 12px 24px; border-radius: 12px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 0.875rem; z-index: 9999; transition: opacity 0.3s; white-space: nowrap; }
    #toast.success { background: #16a34a; color: #fff; }
    #toast.error   { background: #dc2626; color: #fff; }
    #toast.hidden  { opacity: 0; pointer-events: none; }

    .dot { width: 8px; height: 8px; border-radius: 50%; background: #e8e8eb; transition: all 0.3s; }
    .dot.active { background: #ff6035; width: 24px; border-radius: 4px; }
    .dot.done   { background: #16a34a; }
  </style>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-BG9RST726G"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-BG9RST726G');
  </script>
</head>
<body class="bg-background text-on-background font-body selection:bg-primary-container selection:text-on-primary-fixed min-h-screen flex flex-col hero-noise">

  <nav class="fixed top-4 left-1/2 -translate-x-1/2 w-[calc(100%-2rem)] max-w-5xl z-50 glass-nav rounded-2xl shadow-2xl">
    <div class="flex justify-between items-center w-full px-6 py-4">
      <a href="index.html" class="flex items-center gap-3">
        <div class="overflow-hidden rounded-lg w-10 h-10 flex items-center justify-center bg-surface-container-high/50">
          <img alt="Aetherstack Fox" class="w-8 h-8 object-contain" src="/Logo%20maker%20project.png"/>
        </div>
        <span class="text-xl font-black tracking-tighter text-[#111111] font-headline">Aetherstack</span>
      </a>
      <a href="marketing-login.html" class="text-sm font-bold text-on-surface-variant hover:text-primary transition-colors uppercase tracking-widest">Login</a>
    </div>
  </nav>

  <main class="flex-1 flex items-center justify-center pt-32 pb-20 px-4 relative z-10">
    <div id="toast" class="hidden"></div>

    <div class="bg-white rounded-[2.5rem] w-full max-w-xl p-8 md:p-12 shadow-2xl border border-outline-variant/30">
      
      <!-- Progress -->
      <div class="flex items-center gap-2 mb-10">
        <div class="dot active" id="dot-1"></div>
        <div class="dot" id="dot-2"></div>
        <div class="dot" id="dot-3"></div>
      </div>

      <!-- ══ STEP 1: Details ══ -->
      <div id="step-1" class="step">
        <h1 class="font-headline font-black text-4xl tracking-tighter text-on-background mb-2">Join the Team</h1>
        <p class="text-on-surface-variant text-sm mb-10 font-medium">Create your marketer account to start earning.</p>

        <form id="details-form" novalidate class="space-y-2">
          <div class="float-field">
            <input id="f-name" type="text" placeholder=" " required/>
            <label>Full Name *</label>
          </div>
          <div class="float-field">
            <input id="f-email" type="email" placeholder=" " required/>
            <label>Email Address *</label>
          </div>
          <div class="float-field">
            <input id="f-mobile" type="tel" placeholder=" " maxlength="10" required/>
            <label>Mobile Number *</label>
          </div>
          <div class="float-field">
            <input id="f-address" type="text" placeholder=" " required/>
            <label>Address *</label>
          </div>
          <div class="float-field">
            <input id="f-pincode" type="text" placeholder=" " maxlength="6" required/>
            <label>Pincode *</label>
          </div>

          <div class="float-field">
            <input id="f-password" type="password" placeholder=" " required/>
            <label>Password *</label>
            <button type="button" class="eye-btn" id="toggle-pw">
              <span class="material-symbols-outlined text-lg">visibility</span>
            </button>
          </div>
          
          <div class="px-1 mb-6">
            <div class="w-full bg-surface-container-low rounded-full h-1">
              <div id="strength-bar" style="height:3px;border-radius:2px;width:0;transition:all 0.3s;"></div>
            </div>
          </div>

          <div class="float-field">
            <input id="f-confirm" type="password" placeholder=" " required/>
            <label>Confirm Password *</label>
          </div>

          <button type="submit" id="btn-send-otp" class="gradient-primary w-full py-5 rounded-2xl font-headline font-black text-lg text-white shadow-xl mt-4">
            Send OTP to Verify Email
          </button>
        </form>
      </div>

      <!-- ══ STEP 2: OTP ══ -->
      <div id="step-2" class="step hidden-step">
        <button id="btn-back" class="flex items-center gap-2 text-on-surface-variant hover:text-primary text-sm font-bold mb-8 transition-colors">
          <span class="material-symbols-outlined text-lg">arrow_back</span> Back
        </button>
        <h2 class="font-headline font-black text-4xl tracking-tighter text-on-background mb-2">Verify Email</h2>
        <p class="text-on-surface-variant text-sm mb-10">We've sent a 6-digit code to <span id="otp-email-display" class="text-primary font-bold"></span></p>

        <form id="otp-form" novalidate class="space-y-8">
          <div class="float-field">
            <input id="f-otp" type="text" inputmode="numeric" placeholder=" " maxlength="6" required
              style="letter-spacing:0.5em;font-size:1.8rem;font-weight:900;text-align:center;font-family:'Space Grotesk',sans-serif;"/>
            <label style="width:100%;text-align:center;">6-Digit OTP</label>
          </div>
          <button type="submit" id="btn-verify" class="gradient-primary w-full py-5 rounded-2xl font-headline font-black text-lg text-white shadow-xl">
            Verify & Create Account
          </button>
        </form>

        <div class="text-center mt-8">
          <p class="text-on-surface-variant text-xs font-bold uppercase tracking-widest mb-2">Didn't receive it?</p>
          <button id="btn-resend" class="text-primary text-sm font-black hover:opacity-70 transition-opacity disabled:opacity-30" disabled>
            Resend OTP (<span id="resend-timer">60</span>s)
          </button>
        </div>
      </div>

      <!-- ══ STEP 3: Success ══ -->
      <div id="step-3" class="step hidden-step text-center">
        <div class="w-24 h-24 rounded-full bg-primary/10 flex items-center justify-center mx-auto mb-8 border-4 border-white shadow-xl">
          <span class="material-symbols-outlined text-primary text-5xl">check_circle</span>
        </div>
        <h2 class="font-headline font-black text-4xl tracking-tighter text-on-background mb-4">You're In!</h2>
        <p class="text-on-surface-variant font-medium mb-10">Welcome to the team. Use your code to track leads.</p>
        
        <div class="bg-background rounded-3xl p-8 mb-10 border-2 border-dashed border-primary/20">
          <p class="text-on-surface-variant text-[10px] uppercase tracking-[0.2em] font-black mb-2">Your Referral Code</p>
          <p id="success-code" class="font-headline font-black text-6xl text-primary tracking-[0.1em]"></p>
        </div>
        
        <a href="marketing-dashboard.html" class="gradient-primary inline-flex items-center gap-3 px-10 py-5 rounded-2xl font-headline font-black text-lg text-white shadow-xl">
          Go to Dashboard <span class="material-symbols-outlined">arrow_forward</span>
        </a>
      </div>

    </div>
  </main>

  <script>
    const state = { name:'', email:'', mobile:'', address:'', pincode:'', password:'' };
    let resendInterval = null;

    function showToast(msg, type = 'error') {
      const t = document.getElementById('toast');
      t.textContent = msg; t.className = type;
      t.classList.remove('hidden');
      setTimeout(() => t.classList.add('hidden'), 4000);
    }

    function setLoading(btn, loading, label) {
      btn.disabled = loading;
      btn.innerHTML = loading ? '<span class="spinner"></span>' : label;
    }

    function goToStep(n) {
      ['step-1','step-2','step-3'].forEach((id, i) => {
        document.getElementById(id).classList.toggle('hidden-step', i + 1 !== n);
      });
      [1,2,3].forEach(i => {
        const d = document.getElementById('dot-' + i);
        d.classList.toggle('active', i === n);
        d.classList.toggle('done', i < n);
      });
    }

    document.getElementById('f-password').addEventListener('input', function() {
      const v = this.value;
      const bar = document.getElementById('strength-bar');
      let score = 0;
      if (v.length >= 8) score++;
      if (/[A-Z]/.test(v)) score++;
      if (/[0-9]/.test(v)) score++;
      if (/[^A-Za-z0-9]/.test(v)) score++;
      const colors = ['#e8e8eb', '#ef4444', '#f97316', '#eab308', '#16a34a'];
      bar.style.width = (score * 25) + '%';
      bar.style.background = colors[score];
    });

    document.getElementById('toggle-pw').addEventListener('click', function() {
      const inp = document.getElementById('f-password');
      const isPw = inp.type === 'password';
      inp.type = isPw ? 'text' : 'password';
      this.querySelector('span').textContent = isPw ? 'visibility_off' : 'visibility';
    });

    ['f-mobile','f-pincode','f-otp'].forEach(id => {
      document.getElementById(id).addEventListener('input', function() {
        this.value = this.value.replace(/\D/g,'');
      });
    });

    async function api(endpoint, body) {
      const res = await fetch('/api/marketing/' + endpoint, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      return { ok: res.ok, data: await res.json() };
    }

    function startResendCountdown() {
      let secs = 60;
      const btn = document.getElementById('btn-resend');
      const timer = document.getElementById('resend-timer');
      btn.disabled = true;
      resendInterval = setInterval(() => {
        secs--; timer.textContent = secs;
        if (secs <= 0) { clearInterval(resendInterval); btn.disabled = false; btn.innerHTML = 'Resend OTP'; }
      }, 1000);
    }

    document.getElementById('details-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('f-name').value.trim();
      const email = document.getElementById('f-email').value.trim();
      const password = document.getElementById('f-password').value;
      const confirm = document.getElementById('f-confirm').value;
      
      if (password !== confirm) return showToast('Passwords do not match.');
      if (password.length < 8) return showToast('Password too short.');

      Object.assign(state, { 
        name, email, 
        mobile: document.getElementById('f-mobile').value,
        address: document.getElementById('f-address').value,
        pincode: document.getElementById('f-pincode').value,
        password 
      });

      const btn = document.getElementById('btn-send-otp');
      setLoading(btn, true);
      const { ok, data } = await api('send-otp', { email });
      setLoading(btn, false, 'Send OTP to Verify Email');
      
      if (!ok) return showToast(data.error || 'Failed to send OTP.');
      document.getElementById('otp-email-display').textContent = email;
      goToStep(2);
      startResendCountdown();
    });

    document.getElementById('otp-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const otp = document.getElementById('f-otp').value.trim();
      const btn = document.getElementById('btn-verify');
      setLoading(btn, true);

      const verifyRes = await api('verify-otp', { email: state.email, otp });
      if (!verifyRes.ok) {
        setLoading(btn, false, 'Verify & Create Account');
        return showToast(verifyRes.data.error || 'Invalid OTP.');
      }

      const regRes = await api('register', state);
      setLoading(btn, false, 'Verify & Create Account');
      if (!regRes.ok) return showToast(regRes.data.error || 'Registration failed.');

      localStorage.setItem('mkt_token', regRes.data.token);
      document.getElementById('success-code').textContent = regRes.data.referral_code;
      goToStep(3);
    });

    document.getElementById('btn-back').addEventListener('click', () => { clearInterval(resendInterval); goToStep(1); });
    if (localStorage.getItem('mkt_token')) window.location.href = 'marketing-dashboard.html';
  </script>
</body>
</html>
